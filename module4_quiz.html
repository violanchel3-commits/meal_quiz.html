<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Захист та Безпека — Квіз Модуль 4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: #fff; border-radius: 16px; padding: 2rem; max-width: 640px; width: 100%; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .logo { background: #1a3a6b; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px; letter-spacing: .04em; }
  .qnum { font-size: 12px; color: #888; font-weight: 600; }
  .prog-bar { height: 4px; background: #eee; border-radius: 2px; margin-bottom: 1.4rem; }
  .prog-fill { height: 100%; border-radius: 2px; background: #1a3a6b; transition: width .4s; }
  .topic-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: .75rem; }
  .pill-consent { background: #E6F1FB; color: #0C447C; }
  .pill-data { background: #FAEEDA; color: #633806; }
  .pill-harm { background: #EAF3DE; color: #27500A; }
  .pill-access { background: #EEEDFE; color: #3C3489; }
  .scenario { background: #f8f8f5; border: 1px solid #eee; border-radius: 12px; padding: 1rem 1.25rem; font-size: 15px; line-height: 1.65; color: #222; margin-bottom: 1.1rem; }
  .prompt { font-size: 13px; color: #666; margin-bottom: .9rem; font-weight: 500; }
  .opts { display: grid; gap: 8px; margin-bottom: 1rem; }
  .opt { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: .75rem 1rem; font-size: 14px; font-weight: 500; color: #222; cursor: pointer; text-align: left; font-family: inherit; line-height: 1.45; transition: background .15s, border-color .15s; display: flex; gap: 10px; align-items: flex-start; }
  .opt:hover:not(:disabled) { background: #f5f5f0; border-color: #bbb; }
  .opt-letter { font-weight: 700; color: #888; min-width: 16px; flex-shrink: 0; }
  .opt.correct { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .opt.correct .opt-letter { color: #085041; }
  .opt.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
  .opt.wrong .opt-letter { color: #501313; }
  .opt:disabled { cursor: default; }
  .fb { border-radius: 8px; padding: .85rem 1rem; font-size: 14px; line-height: 1.55; margin-bottom: 1rem; display: none; }
  .fb.correct { background: #E1F5EE; color: #085041; border: 1px solid #5DCAA5; }
  .fb.wrong { background: #FCEBEB; color: #501313; border: 1px solid #F09595; }
  .next-btn { background: #1a3a6b; border: none; border-radius: 8px; padding: .7rem 1.5rem; font-size: 14px; font-weight: 500; cursor: pointer; color: #fff; display: none; font-family: inherit; }
  .next-btn:hover { background: #142d54; }
  .result { text-align: center; padding: 2rem 0; }
  .rscore { font-size: 54px; font-weight: 600; color: #1a3a6b; margin-bottom: .4rem; }
  .rlabel { font-size: 15px; color: #666; margin-bottom: 1.75rem; line-height: 1.6; }
  .topics-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.75rem; text-align: left; }
  .topic-row { background: #f8f8f5; border-radius: 8px; padding: .6rem .85rem; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .topic-name { color: #444; }
  .topic-score { font-weight: 600; color: #1a3a6b; }
  .restart { background: #1a3a6b; border: none; border-radius: 8px; padding: .7rem 1.5rem; font-size: 14px; font-weight: 500; cursor: pointer; color: #fff; font-family: inherit; }
  .restart:hover { background: #142d54; }
  @media (max-width: 480px) { .card { padding: 1.25rem; } .topics-wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">ПРАВО НА ЗАХИСТ</div>
    <div class="qnum" id="qnum">1 / 6</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>

  <div id="quiz">
    <div id="tpill"></div>
    <div class="scenario" id="scenario"></div>
    <div class="prompt">Оберіть правильну відповідь:</div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="next-btn" id="nbtn">Наступне питання →</button>
  </div>

  <div class="result" id="result" style="display:none">
    <div class="rscore" id="rscore"></div>
    <div class="rlabel" id="rlabel"></div>
    <div class="topics-wrap" id="topics-wrap"></div>
    <button class="restart" onclick="restart()">Пройти ще раз</button>
  </div>
</div>

<script>
const qs = [
  {
    topic: 'Інформована згода',
    pill: 'pill-consent',
    pillLabel: 'Інформована згода',
    scenario: 'Польовий координатор реєструє бенефіціарів на пункті видачі. Одна жінка погоджується отримати допомогу, але відмовляється підписувати згоду на обробку персональних даних та фотографуватись для звіту. Яка правильна дія?',
    opts: [
      'Відмовити їй у допомозі — без підписаної згоди реєстрація неможлива',
      'Зареєструвати анонімно без фото та персональних даних',
      'Сфотографувати без дозволу — це потрібно для звітності донору',
      'Виключити зі списку отримувачів та повідомити керівника'
    ],
    answer: 1,
    exp: '<strong>Відмова від надання персональних даних не може бути підставою для позбавлення людини гуманітарної допомоги.</strong> Принципи Do No Harm і Dignity вимагають знайти альтернативний спосіб реєстрації без порушення прав людини.'
  },
  {
    topic: 'Мінімізація даних',
    pill: 'pill-data',
    pillLabel: 'Мінімізація даних',
    scenario: 'Організація реєструє учасників програми психосоціальної підтримки — групові заняття у громаді. Жодних виплат чи матеріальної допомоги не передбачено. Які дані є достатніми для реєстрації та звітності?',
    opts: [
      'Фото паспорта та ІПН — для точної ідентифікації учасника',
      'Повна домашня адреса та номери телефонів усіх членів сім\'ї',
      'Вік, стать, громада, категорія вразливості',
      'Медична історія та діагноз — для розуміння потреб учасника'
    ],
    answer: 2,
    exp: '<strong>Принцип мінімізації:</strong> збирайте лише ті дані, які реально необхідні для цілей програми. Для занять без матеріальних виплат достатньо базових демографічних даних. Збір паспортних даних та медичної інформації є надлишковим і порушує права учасників.'
  },
  {
    topic: 'Типи даних',
    pill: 'pill-access',
    pillLabel: 'Типи даних',
    scenario: 'MEAL офіцер працює з базою даних програми психосоціальної підтримки. Серед записів є інформація про випадки насильства та стан психічного здоров\'я бенефіціарів. Як класифікуються ці дані і який рівень захисту вони потребують?',
    opts: [
      'Персональні дані — ім\'я та телефон, стандартний захист',
      'Неперсональні дані — узагальнена статистика, публічний доступ',
      'Конфіденційні персональні дані — найвищий рівень захисту, доступ Need-to-know',
      'Внутрішні дані — доступні всій команді організації'
    ],
    answer: 2,
    exp: '<strong>Інформація про здоров\'я, інвалідність та випадки насильства є конфіденційними персональними даними.</strong> Чим вищий рівень чутливості — тим суворіші вимоги до захисту. Доступ обмежується лише тими, кому це необхідно для роботи (Need-to-know).'
  },
  {
    topic: 'Інформована згода',
    pill: 'pill-consent',
    pillLabel: 'Інформована згода',
    scenario: 'Перед початком опитування координатор пояснює бенефіціару хто збирає дані, навіщо і хто матиме до них доступ. Що є обов\'язковим елементом інформованої згоди який координатор має додатково повідомити?',
    opts: [
      'Що дані будуть передані до державних органів для верифікації',
      'Що участь є добровільною, людина може відмовитись або відкликати згоду в будь-який момент без наслідків',
      'Що відмова від участі вплине на отримання допомоги в майбутньому',
      'Що дані зберігатимуться необмежений час в архіві організації'
    ],
    answer: 1,
    exp: '<strong>Інформована згода має включати:</strong> хто збирає, навіщо, хто матиме доступ, як використовуватимуться — і обов\'язково: що участь є добровільною і згода може бути відкликана в будь-який момент без жодних наслідків для отримання допомоги.'
  },
  {
    topic: 'Матриця доступу',
    pill: 'pill-access',
    pillLabel: 'Рівні доступу',
    scenario: 'MEAL команда працює з даними про постраждалих від гендерно зумовленого насильства (GBV). Керівник проєкту пропонує надати доступ до всієї бази даних усім партнерам консорціуму для кращої координації. Чи це правильно?',
    opts: [
      'Так — прозорість між партнерами є ключовим принципом консорціуму',
      'Так — донор має право знати всі деталі про бенефіціарів',
      'Ні — доступ до конфіденційних даних GBV мають лише ті, кому це необхідно для роботи',
      'Ні — ці дані взагалі не можна зберігати в цифровому форматі'
    ],
    answer: 2,
    exp: '<strong>Принцип Need-to-know:</strong> доступ до строго конфіденційних даних обмежується лише тими співробітниками, яким це безпосередньо необхідно для виконання їхніх функцій. Широкий доступ до даних GBV може поставити під загрозу безпеку постраждалих.'
  },
  {
    topic: 'Do No Harm',
    pill: 'pill-harm',
    pillLabel: 'Do No Harm',
    scenario: 'Під час моніторингу програми підтримки осіб що постраждали від GBV команда помітила низьку відвідуваність сесій. Опитування виявило: жінки бояться втрати конфіденційності, бо місце консультацій добре видиме для громади. Що має зробити команда?',
    opts: [
      'Збільшити кількість консультацій на тому самому місці — звикнуть',
      'Виключити цей показник зі звіту — це не проблема програми',
      'Використати дані моніторингу для адаптації: змінити локацію та запровадити дистанційні консультації',
      'Передати проблему донору і чекати на інструкції'
    ],
    answer: 2,
    exp: '<strong>Це класичний цикл MEAL: дані → аналіз → рішення → адаптація.</strong> Моніторинг виявив бар\'єр доступу пов\'язаний з безпекою. Принцип Do No Harm вимагає не лише фіксувати ризики, а й активно адаптувати програму щоб усунути шкоду.'
  }
];

const letters = ['А', 'Б', 'В', 'Г'];
let cur = 0, score = 0, answered = false;
let topicScores = {};

function render() {
  const q = qs[cur];
  document.getElementById('qnum').textContent = `${cur + 1} / ${qs.length}`;
  document.getElementById('prog').style.width = `${(cur / qs.length) * 100}%`;
  document.getElementById('tpill').innerHTML = `<span class="topic-pill ${q.pill}">${q.pillLabel}</span>`;
  document.getElementById('scenario').textContent = q.scenario;
  document.getElementById('fb').style.display = 'none';
  document.getElementById('nbtn').style.display = 'none';
  answered = false;

  const o = document.getElementById('opts');
  o.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    b.onclick = () => select(i, q);
    o.appendChild(b);
  });
}

function select(idx, q) {
  if (answered) return;
  answered = true;

  if (!topicScores[q.topic]) topicScores[q.topic] = [0, 0];
  topicScores[q.topic][1]++;

  document.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    else if (i === idx && idx !== q.answer) b.classList.add('wrong');
  });

  const ok = idx === q.answer;
  if (ok) { score++; topicScores[q.topic][0]++; }

  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = (ok ? '✓ Правильно! ' : `✗ Правильна відповідь: <strong>${letters[q.answer]}) ${q.opts[q.answer]}</strong>. `) + q.exp;
  fb.style.display = 'block';

  const nb = document.getElementById('nbtn');
  nb.style.display = 'inline-block';
  nb.textContent = cur < qs.length - 1 ? 'Наступне питання →' : 'Переглянути результат →';
}

document.getElementById('nbtn').onclick = () => {
  cur++;
  if (cur >= qs.length) showResult();
  else render();
};

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('prog').style.width = '100%';
  document.getElementById('qnum').textContent = '✓ Завершено';
  document.getElementById('rscore').textContent = `${score} / ${qs.length}`;

  const labels = [
    'Спробуйте ще раз — матеріал про захист даних дуже важливий',
    'Є над чим попрацювати — зверніть увагу на пояснення',
    'Непогано, але є прогалини',
    'Добре! Основи захисту даних засвоєно',
    'Дуже добре!',
    'Відмінно! Модуль 4 засвоєно повністю ✓',
    'Відмінно! Модуль 4 засвоєно повністю ✓'
  ];
  document.getElementById('rlabel').textContent = labels[score] || labels[5];

  const wrap = document.getElementById('topics-wrap');
  wrap.innerHTML = '';
  Object.entries(topicScores).forEach(([name, arr]) => {
    const d = document.createElement('div');
    d.className = 'topic-row';
    d.innerHTML = `<span class="topic-name">${name}</span><span class="topic-score">${arr[0]}/${arr[1]}</span>`;
    wrap.appendChild(d);
  });
}

function restart() {
  cur = 0; score = 0; topicScores = {};
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  render();
}

render();
</script>
</body>
</html>
